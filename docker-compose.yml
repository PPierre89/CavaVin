services:
  app:
    # Tout-en-un : Django + gunicorn avec SQLite. Aucun service de base séparé,
    # donc aucun réseau inter-conteneurs à gérer (déploiement mono-conteneur).
    # Image publiée sur ghcr.io à chaque merge sur main (.github/workflows/docker.yml).
    image: ghcr.io/ppierre89/cavavin:latest
    restart: unless-stopped
    # migrate + collectstatic à chaque démarrage, puis gunicorn.
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-please-generate-a-real-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Accès via un domaine proxifié en HTTPS (accès distant UGREEN, reverse proxy).
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY_SSL: ${DJANGO_TRUST_PROXY_SSL:-False}
      # Base SQLite stockée sur le volume `data` -> persiste à la recréation du conteneur.
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      # Bind mounts relatifs au dossier du compose : la base SQLite et les fichiers
      # statiques restent visibles dans le dossier du projet (sauvegarde = copier le
      # dossier). Les répertoires sont créés au premier démarrage.
      - ./data:/data
      - ./staticfiles_data:/app/staticfiles
    ports:
      # Port hôte configurable (mets APP_PORT=4173 dans .env si 8000 est déjà pris sur le NAS).
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
